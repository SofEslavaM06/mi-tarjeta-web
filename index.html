<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi tarjeta interactiva</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Mi tarjeta de presentación</h1>

    <div class="tarjeta" id="tarjeta">

        <div class="tarjeta-interior">

            <!-- Parte delantera -->
            <div class="frente">
                <h2>¡Hola!</h2>
                <p>Bienvenido a mi tarjeta de presentación.</p>
                <button onclick="girarTarjeta()">Ver más</button>
            </div>

            <!-- Parte trasera -->
            <div class="atras">
                <h2>Mi presentación</h2>
                <p>Conoce un poco más sobre mí.</p>
                <button onclick="iniciarJuego()">Iniciar juego</button>
            </div>

        </div>

    </div>

    <!-- Espacio para el juego -->
    <div id="juego"></div>

    <script src="script.js"></script>

</body>
</html>
